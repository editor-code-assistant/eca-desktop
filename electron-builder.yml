appId: dev.eca.desktop
productName: ECA
artifactName: eca-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - eca-webview/dist/**/*
  - resources/**/*
  - src/renderer/**/*

mac:
  category: public.app-category.developer-tools
  icon: resources/icon.png
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

linux:
  # Multi-size set (16-512px) generated from resources/icon.png; the
  # flatpak target silently drops icons >512px, and a proper hicolor
  # set is better for AppImage/deb desktop integration too.
  icon: build/icons
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  category: Development
  maintainer: Editor Code Assistant

deb:
  fpm:
    - "--after-install=build/linux-after-install.sh"

# Built explicitly with `npm run package:flatpak` (or in CI with
# `electron-builder --linux flatpak --x64`) so the default AppImage/deb
# matrix above stays untouched. Requires `flatpak` + `flatpak-builder`
# plus the runtimes/BaseApp installed (see README "Package" section).
# The chromium sandbox is provided by zypak from the Electron BaseApp —
# no SUID chrome-sandbox needed (linux-after-install.sh is deb-only).
flatpak:
  runtimeVersion: '24.08'
  baseVersion: '24.08'
  finishArgs:
    # Windowing: native Wayland when available (Electron/Chromium
    # auto-detects via WAYLAND_DISPLAY), X11/XWayland otherwise.
    - --share=ipc
    - --socket=wayland
    - --socket=x11
    - --device=dri
    # ECA server download/auto-update, LLM providers, MCP servers.
    - --share=network
    # Project files + the managed server binary in ~/.eca-desktop and
    # the shared eca config in ~/.config/eca.
    - --filesystem=home
    # Lets the app spawn the ECA server on the HOST (flatpak-spawn
    # --host) so the agent can use the real toolchain: git, shells,
    # user-configured MCP servers. Without it the app still works but
    # the server runs sandboxed, seeing only the freedesktop runtime.
    - --talk-name=org.freedesktop.Flatpak
  files:
    - ["build/dev.eca.desktop.metainfo.xml", "/share/metainfo/dev.eca.desktop.metainfo.xml"]

win:
  icon: resources/icon.png
  target:
    # Portable: one self-contained .exe, double-click to run. No
    # installer, no admin rights (requestExecutionLevel defaults to
    # `user`), no runtime prerequisites. Unsigned on purpose — signing
    # needs a paid certificate or a Microsoft/Azure account — so
    # SmartScreen asks for "More info → Run anyway" on first launch.
    # electron-updater can't update a portable exe (no latest.yml is
    # published for it); updater.ts notifies about new releases instead.
    # x64 only: upstream ECA server publishes no windows-aarch64 binary
    # (Windows on ARM runs the x64 build under emulation).
    - target: portable
      arch: [x64]

portable:
  # Every launch extracts the app to a temp dir, runs it, and deletes
  # the dir once it exits. `true` makes that dir unique per launch
  # ($PLUGINSDIR\app). The schema documents `false` for this, but the
  # code (NsisTarget: `typeof v === "string" || !v` → shared per-build
  # ksuid dir) only skips the shared dir for `true`. With a shared dir a
  # second launch wipes the running instance's files
  # (electron-builder#5764); per-launch dirs let the second instance
  # just hit the single-instance lock and focus the running window.
  unpackDirName: true
  # Shown while extracting (~350 MB, a few seconds) so a double-click
  # gets immediate feedback instead of a silent pause. NSIS BgImage
  # loads it with LoadImage: keep it an uncompressed BMP3 (currently
  # 400x260, 8-bit palette); the popup is sized to the image and
  # centered. Known upstream wart (electron-builder#7871): with a splash
  # the launcher isn't silent, so its tiny NSIS window flashes briefly
  # at start and on exit. Drop this line to get a fully silent launch.
  splashImage: build/win-portable-splash.bmp

publish:
  provider: github
  owner: editor-code-assistant
  repo: eca-desktop
